services:
  musicdl:
    build: ./app
    container_name: adbk-dl
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - downloads:/data/downloads
    environment:
      # How long a finished job's file stays on disk before cleanup, in seconds.
      - FILE_TTL_SECONDS=3600

volumes:
  downloads:
